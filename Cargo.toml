[package]
name = "hedron-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
description = "HedronDB Phase 0: desired state, causal event log, vault isolation"
publish = false
default-run = "hedron"

[dependencies]
# Exact pins keep the crate on rustc 1.83; newer blake3/uuid/indexmap need 1.85.
blake3 = "1.8"
indexmap = { version = "2", features = ["std"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
uuid = { version = "1.11", features = ["serde", "v4"] }

[[bin]]
name = "hedron"
path = "src/bin/hedron.rs"

[[bin]]
name = "hedron-import"
path = "src/bin/hedron-import.rs"
